<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake - Kaplay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <script src="node_modules/kaplay/dist/kaplay.js"></script>
    <script>
        kaplay({
            width: 640,
            height: 640,
            background: [15, 15, 15],
            scale: 1,
            debug: false,
            global: true,
        });

        const SIZE = 640;
        const CELL = 32;
        const BFS_MAX_DEPTH = 200;

        const DIRS = [
            vec2(0, -1),
            vec2(0, 1),
            vec2(-1, 0),
            vec2(1, 0),
        ];

        let snake;
        let dir;
        let nextDir;
        let food;
        let score;
        let highScore = 0;
        let gameOver;
        let moveTimer;
        let autoplay = false;
        let trails = [];
        let particles = [];
        let popups = [];
        let streak = 0;
        let maxStreak = 0;
        let stars = [];
        let eatFlash = 0;
        let blocks = [];
        let blockedCells = new Set();
        let cam = vec2(0, 0);

        function vec2key(v) {
            return `${v.x},${v.y}`;
        }

        function buildBlockedCells() {
            const s = new Set();
            for (const b of blocks) {
                for (let i = 0; i < b.w; i++) {
                    for (let j = 0; j < b.h; j++) {
                        s.add(`${b.x + i},${b.y + j}`);
                    }
                }
            }
            blockedCells = s;
        }

        function generateBlocks() {
            blocks = [];
            for (let i = 0; i < 80; i++) {
                const w = 1 + Math.floor(Math.random() * 3);
                const h = 1 + Math.floor(Math.random() * 3);
                let x, y, ok;
                let tries = 0;
                do {
                    x = Math.floor(Math.random() * 80 - 40);
                    y = Math.floor(Math.random() * 80 - 40);
                    ok = true;
                    for (let di = -1; di < w + 1 && ok; di++) {
                        for (let dj = -1; dj < h + 1 && ok; dj++) {
                            const bx = x + di, by = y + dj;
                            if (
                                bx >= 2 && bx <= 8 &&
                                by >= 8 && by <= 12
                            ) ok = false;
                        }
                    }
                    tries++;
                } while (!ok && tries < 50);
                if (ok) blocks.push({ x, y, w, h });
            }
            buildBlockedCells();
        }

        function isOnBlock(pos) {
            return blockedCells.has(vec2key(pos));
        }

        function spawnFood() {
            let pos;
            let tries = 0;
            do {
                pos = vec2(
                    snake[0].x + Math.floor(Math.random() * 21 - 10),
                    snake[0].y + Math.floor(Math.random() * 21 - 10),
                );
                tries++;
            } while (
                tries < 100 && (
                    snake.some(s => s.x === pos.x && s.y === pos.y) ||
                    isOnBlock(pos)
                )
            );
            food = pos;
        }

        function burstParticles(x, y, color, n) {
            const cx = x * CELL + CELL / 2;
            const cy = y * CELL + CELL / 2;
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 80 + Math.random() * 120;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s,
                    life: 1,
                    size: 2 + Math.random() * 4,
                    color: hsl2rgb(
                        (color + Math.random() * 0.15) % 1,
                        0.9,
                        0.5 + Math.random() * 0.3,
                    ),
                });
            }
        }

        function isSafe(pos, obs) {
            const o = obs ?? snake;
            if (o.some(s => s.x === pos.x && s.y === pos.y)) return false;
            if (isOnBlock(pos)) return false;
            return true;
        }

        function findPath(start, goal, obstacles) {
            const blocked = new Set(obstacles.map(vec2key));
            for (const k of blockedCells) blocked.add(k);
            blocked.delete(vec2key(goal));

            if (blocked.has(vec2key(start))) return null;

            const visited = new Set([vec2key(start)]);
            const queue = [{ pos: start, path: [], depth: 0 }];

            while (queue.length > 0) {
                const { pos, path, depth } = queue.shift();
                if (depth > BFS_MAX_DEPTH) continue;

                if (pos.x === goal.x && pos.y === goal.y) {
                    return path;
                }

                for (const d of DIRS) {
                    const key = `${pos.x + d.x},${pos.y + d.y}`;
                    if (!visited.has(key) && !blocked.has(key)) {
                        visited.add(key);
                        queue.push({ pos: vec2(pos.x + d.x, pos.y + d.y), path: [...path, d], depth: depth + 1 });
                    }
                }
            }

            return null;
        }

        function simulateNewSnake(newHead) {
            const ate = newHead.x === food.x && newHead.y === food.y;
            const newSnake = [newHead, ...snake];
            if (!ate) newSnake.pop();
            return { newSnake, ate };
        }

        function canEscape(sim) {
            const sHead = sim.newSnake[0];
            const sTail = sim.newSnake[sim.newSnake.length - 1];
            const sBody = sim.newSnake.slice(1, -1);
            const escape = findPath(sHead, sTail, sBody);
            return escape !== null;
        }

        function autoplayDir() {
            const head = snake[0];
            const obstacles = snake.slice(1, -1);

            let path = findPath(head, food, obstacles);
            if (path && path.length > 0) {
                const nextPos = vec2(head.x + path[0].x, head.y + path[0].y);
                const sim = simulateNewSnake(nextPos);
                if (canEscape(sim)) return path[0];
            }

            const tail = snake[snake.length - 1];
            path = findPath(head, tail, obstacles);
            if (path && path.length > 0) return path[0];

            for (const d of DIRS) {
                const np = vec2(head.x + d.x, head.y + d.y);
                if (np.x === tail.x && np.y === tail.y) return d;
                if (isSafe(np, snake.slice(0, -1))) return d;
            }

            return dir;
        }

        function init() {
            snake = [
                vec2(5, 10),
                vec2(4, 10),
                vec2(3, 10),
            ];
            dir = vec2(1, 0);
            nextDir = vec2(1, 0);
            score = 0;
            gameOver = false;
            moveTimer = 0;
            trails = [];
            particles = [];
            popups = [];
            streak = 0;
            stars = [];
            eatFlash = 0;
            generateBlocks();
            spawnFood();

            if (autoplay) {
                for (let i = 0; i < 60; i++) {
                    stars.push({
                        x: Math.random() * 4000 - 2000,
                        y: Math.random() * 4000 - 2000,
                        size: 1 + Math.random() * 2,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }
        }

        onKeyPress("up", () => { if (!autoplay && dir.y !== 1) nextDir = vec2(0, -1); });
        onKeyPress("down", () => { if (!autoplay && dir.y !== -1) nextDir = vec2(0, 1); });
        onKeyPress("left", () => { if (!autoplay && dir.x !== 1) nextDir = vec2(-1, 0); });
        onKeyPress("right", () => { if (!autoplay && dir.x !== -1) nextDir = vec2(1, 0); });
        onKeyPress("space", () => { if (gameOver) init(); });
        onKeyPress("a", () => {
            autoplay = !autoplay;
            if (autoplay && stars.length === 0) {
                for (let i = 0; i < 60; i++) {
                    stars.push({
                        x: Math.random() * 4000 - 2000,
                        y: Math.random() * 4000 - 2000,
                        size: 1 + Math.random() * 2,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }
        });

        onMousePress(() => {
            const sx = mousePos().x - (cam.x - SIZE / 2);
            const sy = mousePos().y - (cam.y - SIZE / 2);
            if (
                sx >= SIZE - 140 && sx <= SIZE - 12 &&
                sy >= SIZE - 44 && sy <= SIZE - 12
            ) {
                autoplay = !autoplay;
                if (autoplay && stars.length === 0) {
                    for (let i = 0; i < 60; i++) {
                        stars.push({
                            x: Math.random() * 4000 - 2000,
                            y: Math.random() * 4000 - 2000,
                            size: 1 + Math.random() * 2,
                            phase: Math.random() * Math.PI * 2,
                        });
                    }
                }
            }
        });

        onUpdate(() => {
            if (gameOver) return;

            if (autoplay) {
                nextDir = autoplayDir();
            }

            const speed = autoplay ? Math.max(0.03, 0.06 - score * 0.001) : 0.12;
            moveTimer += dt();
            if (moveTimer < speed) return;
            moveTimer = 0;

            dir = nextDir;

            if (autoplay) {
                trails.push({
                    pos: vec2(snake[0].x, snake[0].y),
                    life: 1,
                });
            }

            const head = vec2(snake[0].x + dir.x, snake[0].y + dir.y);

            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver = true;
                highScore = Math.max(highScore, score);
                streak = 0;
                return;
            }

            if (isOnBlock(head)) {
                gameOver = true;
                highScore = Math.max(highScore, score);
                streak = 0;
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                streak++;
                maxStreak = Math.max(maxStreak, streak);
                eatFlash = 1;
                popups.push({ text: `+1`, x: food.x, y: food.y, life: 1 });
                if (autoplay) {
                    burstParticles(food.x, food.y, 0.1, 16);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            trails = trails.filter(t => t.life > 0);
            trails.forEach(t => t.life -= dt() * 2);

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx * dt();
                p.y += p.vy * dt();
                p.vx *= 0.93;
                p.vy *= 0.93;
                p.life -= dt() * 1.8;
            });

            popups = popups.filter(p => p.life > 0);
            popups.forEach(p => {
                p.life -= dt() * 1.2;
            });

            eatFlash = Math.max(0, eatFlash - dt() * 3);

            if (autoplay) {
                stars.forEach(s => {
                    s.y -= 20 * dt();
                    if (s.y < cam.y - SIZE) { s.y = cam.y + SIZE; s.x = cam.x + Math.random() * 800 - 400; }
                });
            }
        });

        onDraw(() => {
            cam = vec2(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2);
            camPos(cam.x, cam.y);

            // --- WORLD SPACE ---

            const visCols = Math.ceil(SIZE / CELL) + 4;
            const originX = Math.floor((cam.x - SIZE / 2) / CELL);
            const originY = Math.floor((cam.y - SIZE / 2) / CELL);

            for (let i = -1; i < visCols; i++) {
                for (let j = -1; j < visCols; j++) {
                    const gx = originX + i, gy = originY + j;
                    drawRect({
                        pos: vec2(gx * CELL, gy * CELL),
                        width: CELL,
                        height: CELL,
                        color: (gx + gy) % 2 === 0 ? rgb(25, 25, 25) : rgb(18, 18, 18),
                    });
                }
            }

            for (const b of blocks) {
                drawRect({
                    pos: vec2(b.x * CELL + 1, b.y * CELL + 1),
                    width: b.w * CELL - 2,
                    height: b.h * CELL - 2,
                    color: rgb(40, 30, 20),
                    radius: 3,
                });
                drawRect({
                    pos: vec2(b.x * CELL, b.y * CELL),
                    width: b.w * CELL,
                    height: b.h * CELL,
                    fill: false,
                    outline: { color: rgb(60, 45, 30), width: 1.5 },
                    radius: 3,
                });
                for (let i = 0; i < b.w; i++) {
                    for (let j = 0; j < b.h; j++) {
                        if ((i + j) % 2 === 0) {
                            drawRect({
                                pos: vec2((b.x + i) * CELL + 4, (b.y + j) * CELL + 4),
                                width: CELL - 8,
                                height: CELL - 8,
                                color: rgb(50, 38, 25),
                                radius: 2,
                                opacity: 0.5,
                            });
                        }
                    }
                }
            }

            if (autoplay) {
                const visHalf = SIZE / 2 + 100;
                stars.forEach(s => {
                    if (Math.abs(s.x - cam.x) > visHalf || Math.abs(s.y - cam.y) > visHalf) return;
                    const twinkle = Math.sin(time() * 2 + s.phase) * 0.5 + 0.5;
                    drawRect({
                        pos: vec2(s.x, s.y),
                        width: s.size,
                        height: s.size,
                        color: rgb(150, 120, 255),
                        opacity: twinkle * 0.5,
                        radius: 2,
                    });
                });
            }

            if (eatFlash > 0) {
                const f = eatFlash * 0.5;
                drawRect({
                    pos: vec2(cam.x - SIZE / 2, cam.y - SIZE / 2),
                    width: SIZE,
                    height: SIZE,
                    color: rgb(255, 200, 100),
                    opacity: f * 0.08,
                });
            }

            trails.forEach(t => {
                drawRect({
                    pos: vec2(t.pos.x * CELL, t.pos.y * CELL),
                    width: CELL,
                    height: CELL,
                    color: hsl2rgb(t.life * 0.8, 0.7, 0.4),
                    opacity: t.life * 0.35,
                    radius: 3,
                });
            });

            particles.forEach(p => {
                drawRect({
                    pos: vec2(p.x - p.size / 2, p.y - p.size / 2),
                    width: p.size,
                    height: p.size,
                    color: p.color,
                    opacity: p.life,
                    radius: 3,
                });
            });

            popups.forEach(p => {
                drawText({
                    text: p.text,
                    pos: vec2(p.x * CELL + CELL / 2, p.y * CELL - (1 - p.life) * 30),
                    size: 18 + (1 - p.life) * 8,
                    color: rgb(255, 255, 120),
                    opacity: p.life,
                    font: "monospace",
                    anchor: "center",
                });
            });

            if (autoplay) {
                const pulse = Math.sin(time() * 6) * 0.5 + 0.5;
                snake.forEach((seg, i) => {
                    const hue = (time() * 60 + i * 20) % 360;
                    for (let k = 3; k > 0; k--) {
                        const spread = (k + 1) * 5;
                        drawRect({
                            pos: vec2(
                                seg.x * CELL - spread + 1,
                                seg.y * CELL - spread + 1,
                            ),
                            width: CELL - 2 + spread * 2,
                            height: CELL - 2 + spread * 2,
                            color: hsl2rgb((hue + k * 40) / 360, 0.8, 0.5 + k * 0.1),
                            opacity: (0.12 - k * 0.03) * pulse,
                            radius: 6,
                        });
                    }
                });
            }

            snake.forEach((seg, i) => {
                const hue = autoplay
                    ? (time() * 80 + i * 15) % 360
                    : 120;
                const sat = autoplay ? 0.9 : 0.8;
                const lit = autoplay ? 0.55 : i === 0 ? 0.5 : 0.4;
                drawRect({
                    pos: vec2(seg.x * CELL + 1, seg.y * CELL + 1),
                    width: CELL - 2,
                    height: CELL - 2,
                    color: hsl2rgb(hue / 360, sat, lit),
                    radius: i === 0 ? 4 : 2,
                });
            });

            const foodPulse = Math.sin(time() * 5) * 0.15 + 1;
            const foodGlow = Math.sin(time() * 5) * 0.3 + 0.7;
            const foodSize = (CELL - 4) * foodPulse;
            const foodOffset = (CELL - foodSize) / 2;

            for (let k = 2; k > 0; k--) {
                drawRect({
                    pos: vec2(food.x * CELL - k * 3, food.y * CELL - k * 3),
                    width: CELL + k * 6,
                    height: CELL + k * 6,
                    color: rgb(255, 60, 60),
                    opacity: 0.1 * foodGlow,
                    radius: 6,
                });
            }
            drawRect({
                pos: vec2(food.x * CELL + foodOffset, food.y * CELL + foodOffset),
                width: foodSize,
                height: foodSize,
                color: rgb(255, 60, 60),
                radius: 4,
            });

            // --- UI (world-space offset to stay fixed on screen) ---

            const ux = cam.x - SIZE / 2;
            const uy = cam.y - SIZE / 2;

            drawText({
                text: `SCORE: ${score}`,
                pos: vec2(ux + 12, uy + 12),
                size: 20,
                color: rgb(200, 200, 200),
                font: "monospace",
            });

            drawText({
                text: `BEST: ${highScore}`,
                pos: vec2(ux + SIZE - 12, uy + 12),
                size: 20,
                color: rgb(100, 100, 100),
                font: "monospace",
                anchor: "topright",
            });

            if (autoplay && streak >= 2) {
                const streakHue = (time() * 50) % 360;
                drawText({
                    text: `🔥 x${streak}`,
                    pos: vec2(ux + SIZE / 2, uy + 42),
                    size: 18 + Math.sin(time() * 4) * 2,
                    color: hsl2rgb(streakHue / 360, 0.9, 0.6),
                    font: "monospace",
                    anchor: "center",
                });
            }

            if (autoplay) {
                const borderColor = hsl2rgb(((time() * 40) % 360) / 360, 0.8, 0.5);
                const bp = Math.sin(time() * 4) * 0.5 + 0.5;
                for (let b = 1; b <= 4; b++) {
                    drawRect({
                        pos: vec2(ux + b * 2, uy + b * 2),
                        width: SIZE - b * 4,
                        height: SIZE - b * 4,
                        fill: false,
                        outline: { color: borderColor, width: 1 },
                        opacity: 0.12 - b * 0.025 * bp,
                    });
                }
            }

            const auraColor = autoplay
                ? hsl2rgb(((time() * 40) % 360) / 360, 0.9, 0.6)
                : rgb(80, 80, 80);
            const auraPulse = autoplay ? Math.sin(time() * 5) * 0.3 + 0.7 : 1;

            drawRect({
                pos: vec2(ux + SIZE - 142, uy + SIZE - 46),
                width: 130,
                height: 34,
                color: rgb(20, 20, 20),
                outline: { color: auraColor, width: 1.5 },
                radius: 6,
            });

            if (autoplay) {
                for (let k = 2; k > 0; k--) {
                    drawRect({
                        pos: vec2(ux + SIZE - 142 - k * 3, uy + SIZE - 46 - k * 3),
                        width: 130 + k * 6,
                        height: 34 + k * 6,
                        color: auraColor,
                        opacity: 0.08 * auraPulse,
                        radius: 6,
                    });
                }
            }

            drawText({
                text: autoplay ? "✦ AURA ON" : "AURA OFF",
                pos: vec2(ux + SIZE - 22, uy + SIZE - 29),
                size: 16,
                color: auraColor,
                font: "monospace",
                anchor: "topright",
            });

            if (autoplay) {
                const hintPulse = Math.sin(time() * 3) * 0.3 + 0.7;
                drawText({
                    text: `♫ ${score} pts`,
                    pos: vec2(ux + SIZE / 2, uy + SIZE - 16),
                    size: 14,
                    color: rgb(150, 100, 255),
                    opacity: hintPulse * 0.6,
                    font: "monospace",
                    anchor: "center",
                });
            }

            if (gameOver) {
                drawRect({
                    pos: vec2(ux, uy),
                    width: SIZE,
                    height: SIZE,
                    color: rgb(0, 0, 0),
                    opacity: 0.7,
                });

                drawText({
                    text: "GAME OVER",
                    pos: vec2(ux + SIZE / 2, uy + SIZE / 2 - 40),
                    size: 48,
                    color: rgb(255, 60, 60),
                    font: "monospace",
                    anchor: "center",
                });

                drawText({
                    text: `Score: ${score}`,
                    pos: vec2(ux + SIZE / 2, uy + SIZE / 2 + 10),
                    size: 28,
                    color: rgb(200, 200, 200),
                    font: "monospace",
                    anchor: "center",
                });

                if (maxStreak > 1) {
                    drawText({
                        text: `Best streak: ${maxStreak}`,
                        pos: vec2(ux + SIZE / 2, uy + SIZE / 2 + 42),
                        size: 16,
                        color: rgb(150, 100, 255),
                        font: "monospace",
                        anchor: "center",
                    });
                }

                drawText({
                    text: "SPACE per ricominciare",
                    pos: vec2(ux + SIZE / 2, uy + SIZE / 2 + 70),
                    size: 16,
                    color: rgb(120, 120, 120),
                    font: "monospace",
                    anchor: "center",
                });
            }
        });

        init();
    </script>
</body>
</html>
