<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indagine Risultati Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 md:p-8">
    <main class="mx-auto max-w-3xl space-y-4">
        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
            <h1 class="text-2xl font-bold text-slate-900">Indagine sui Risultati dei Quiz</h1>
            <p class="mt-1 text-sm text-slate-600">Compila il modulo, invia il quiz e visualizza subito punteggio e valutazione.</p>

            <form id="quizForm" class="mt-5 space-y-4">
                <div>
                    <label for="fullName" class="mb-1 block text-sm font-medium text-slate-700">Nome e Cognome</label>
                    <input id="fullName" type="text" placeholder="Mario Rossi" class="w-full rounded-md border border-slate-300 p-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                </div>

                <div>
                    <label for="studentClass" class="mb-1 block text-sm font-medium text-slate-700">Classe</label>
                    <select id="studentClass" class="w-full rounded-md border border-slate-300 p-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                        <option value="">Seleziona classe</option>
                        <option value="1A">1A</option>
                        <option value="2A">2A</option>
                        <option value="3A">3A</option>
                        <option value="4A">4A</option>
                        <option value="5A">5A</option>
                    </select>
                </div>

                <fieldset class="rounded-lg border border-slate-300 p-3">
                    <legend class="px-1 text-sm font-semibold text-slate-700">1) Qual e la capitale della Francia?</legend>
                    <div class="mt-2 space-y-1 text-slate-700">
                        <label class="block"><input type="radio" name="q1" value="a" class="mr-2">a) Berlino</label>
                        <label class="block"><input type="radio" name="q1" value="b" class="mr-2">b) Madrid</label>
                        <label class="block"><input type="radio" name="q1" value="c" class="mr-2">c) Parigi</label>
                        <label class="block"><input type="radio" name="q1" value="d" class="mr-2">d) Roma</label>
                    </div>
                </fieldset>

                <fieldset class="rounded-lg border border-slate-300 p-3">
                    <legend class="px-1 text-sm font-semibold text-slate-700">2) Quale pianeta e conosciuto come il Pianeta Rosso?</legend>
                    <div class="mt-2 space-y-1 text-slate-700">
                        <label class="block"><input type="radio" name="q2" value="a" class="mr-2">a) Marte</label>
                        <label class="block"><input type="radio" name="q2" value="b" class="mr-2">b) Venere</label>
                        <label class="block"><input type="radio" name="q2" value="c" class="mr-2">c) Giove</label>
                        <label class="block"><input type="radio" name="q2" value="d" class="mr-2">d) Saturno</label>
                    </div>
                </fieldset>

                <fieldset class="rounded-lg border border-slate-300 p-3">
                    <legend class="px-1 text-sm font-semibold text-slate-700">3) Quanto fa 5 x 6?</legend>
                    <div class="mt-2 space-y-1 text-slate-700">
                        <label class="block"><input type="radio" name="q3" value="a" class="mr-2">a) 25</label>
                        <label class="block"><input type="radio" name="q3" value="b" class="mr-2">b) 30</label>
                        <label class="block"><input type="radio" name="q3" value="c" class="mr-2">c) 35</label>
                        <label class="block"><input type="radio" name="q3" value="d" class="mr-2">d) 40</label>
                    </div>
                </fieldset>

                <div id="formMessage" class="hidden rounded-md border p-2 text-sm"></div>
                <button type="submit" class="w-full rounded-md bg-blue-600 p-2 font-medium text-white transition hover:bg-blue-700">Invia Quiz</button>
            </form>
        </section>

        <section id="resultBox" class="hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
            <h2 class="text-xl font-bold text-slate-900">Riepilogo Personale</h2>
            <p id="resultStudent" class="mt-3 text-slate-700"></p>
            <p id="resultAnswers" class="mt-1 text-slate-700"></p>
            <p id="resultScore" class="mt-1 font-semibold text-slate-900"></p>
            <p id="resultEvaluation" class="mt-1 font-semibold"></p>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
